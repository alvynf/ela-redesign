<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELA UTDI - Portal Learning Modern</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Jakarta Sans & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- ==================== PAGE 1: LOGIN ==================== -->
  <div id="login-page" class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-logo">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h2>Selamat Datang! 👋</h2>
        <p>Masuk ke portal e-learning ELA UTDI</p>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">NIM / Username</label>
          <div class="input-with-icon">
            <i class="fa-regular fa-user"></i>
            <input type="text" id="username" placeholder="Masukkan NIM (Cth: alpi)" required autocomplete="off">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Kata Sandi</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Masukkan password terserah" required>
          </div>
        </div>

        <button type="submit" class="btn-primary-block">
          Masuk Sekarang <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="auth-divider"><span>atau masuk dengan</span></div>

      <button type="button" class="btn-sso" onclick="handleSSOLogin()">
